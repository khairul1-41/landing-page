<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner ambient circle -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.06" />

  <!-- Rocket Ship Group centered within safe zone (80% circle) -->
  <g transform="translate(256, 235) rotate(45) scale(1.4) translate(-120, -120)">
    <!-- Exhaust flame -->
    <path d="M120 180 C110 210, 105 230, 120 250 C135 230, 130 210, 120 180 Z" fill="url(#fireGrad)" filter="url(#glow)" />
    
    <!-- Rocket fins -->
    <path d="M70 145 C60 170, 70 185, 95 180 L105 160 Z" fill="#c7d2fe" />
    <path d="M170 145 C180 170, 170 185, 145 180 L135 160 Z" fill="#c7d2fe" />
    
    <!-- Rocket body -->
    <path d="M120 40 C95 80, 90 140, 100 175 L140 175 C150 140, 145 80, 120 40 Z" fill="url(#rocketGrad)" />
    
    <!-- Nose cone highlight -->
    <path d="M120 40 C110 60, 105 80, 105 95 L135 95 C135 80, 130 60, 120 40 Z" fill="#6366f1" opacity="0.9" />

    <!-- Porthole Window -->
    <circle cx="120" cy="120" r="18" fill="#1e1b4b" />
    <circle cx="120" cy="120" r="14" fill="#38bdf8" />
    <circle cx="116" cy="116" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Brand Sparkles -->
  <g fill="#fbbf24" opacity="0.9">
    <path d="M370 120 Q370 140 390 140 Q370 140 370 160 Q370 140 350 140 Q370 140 370 120 Z" />
    <path d="M140 360 Q140 375 155 375 Q140 375 140 390 Q140 375 125 375 Q140 375 140 360 Z" />
  </g>
</svg>
